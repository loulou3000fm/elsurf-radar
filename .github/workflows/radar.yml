name: Radar quotidien

on:
  schedule:
    # Tous les jours à 6h17 UTC (8h17 à Paris en été, 7h17 en hiver).
    # Pas à l'heure pile : GitHub y est surchargé et retarde ou saute des passages.
    - cron: '17 6 * * *'
  # Permet aussi un lancement manuel depuis l'onglet Actions.
  workflow_dispatch:

# Écriture nécessaire pour commiter seen.json à la fin du passage.
permissions:
  contents: write

# Jamais deux passages en même temps : ils se disputeraient seen.json.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Agréger les flux et envoyer le récap
        run: npm start
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # La machine est effacée après chaque passage : sans ce commit, le script
      # oublierait les sorties déjà vues et les annoncerait à nouveau le lendemain.
      - name: Sauvegarder la mémoire des sorties vues
        run: |
          if git diff --quiet -- seen.json; then
            echo "seen.json inchangé, rien à sauvegarder."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Met à jour seen.json"
            git push
          fi
